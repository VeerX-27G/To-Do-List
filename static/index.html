<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo List</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>📝 To-Do List</h1>

    <form id="todo-form">
      <input type="text" class="todo-input" placeholder="Add a new todo..." required>
      <button type="submit" class="btn-add">Add</button>
    </form>

    <ul id="todo-list"></ul>
  </div>

  <script src="/script.js"></script>
</body>
</html>
